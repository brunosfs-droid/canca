name: Workspace Foundation CI

on:
  push:
    branches: [ main, "feature/**", "fix/**", "chore/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  workspace-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: canca_workspace_ci
          POSTGRES_USER: canca_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canca_ci -d canca_workspace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: canca_workspace_ci
      PGUSER: canca_ci
      PGPASSWORD: synthetic-ci-only
      CANCA_TEST_WORKSPACE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install -r persistence/requirements-postgres.txt
      - name: Compile workspace foundation
        run: python -m py_compile persistence/P01_Workspace.py persistence/P01_PostgreSQL.py persistence/P01_Workspace_Model.py server/P01_Workspace_Coordinator.py server/P01_Workspace_Service.py server/P01_Workspace_API.py server/P01_Workspace_Audit.py server/P01_Workspace_Audit_Review.py tests/test_workspace_audit_review.py server/P01_Workspace_Category_Reader.py server/P01_Workspace_Observed_Signals.py server/P01_Workspace_Signal_Summary.py server/P01_Workspace_Signal_Quality.py server/P01_Workspace_Observation_Comparison.py server/P01_Workspace_Category_Signal_Coverage.py tests/test_workspace_category_reader.py tests/test_workspace_observed_signals.py tests/test_workspace_signal_summary.py tests/test_workspace_signal_quality.py tests/test_workspace_observation_comparison.py tests/test_workspace_category_signal_coverage.py tests/test_postgres_workspace.py tests/test_workspace_coordinator.py tests/test_workspace_model.py tests/test_workspace_service.py tests/test_workspace_api.py tests/test_workspace_audit.py persistence/P01_Workspace_Recovery.py tests/test_workspace_recovery.py tests/workspace_backup_restore_smoke.py tests/test_workspace_backup_guard.py persistence/P01_Workspace_Legacy.py server/P01_Workspace_Legacy_Readiness.py server/P01_Workspace_Legacy_Jobs.py server/P01_Workspace_Live_Intent.py server/P01_Workspace_Intent_Receipts.py tests/test_workspace_live_intent.py tests/test_workspace_intent_receipts.py tests/test_workspace_live_intent_http.py tests/test_workspace_legacy.py tests/test_workspace_legacy_readiness.py tests/test_workspace_legacy_jobs.py persistence/P01_Workspace_Intent_Ledger.py tests/test_workspace_intent_ledger.py
      - name: Test real workspace isolation and opt-in migration
        run: python -m unittest discover -s tests -p "test_postgres_workspace.py" -v
      - name: Test single-workspace lifecycle and real SQL session leases
        run: python -m unittest discover -s tests -p "test_workspace_coordinator.py" -v
      - name: Test workspace history graph and revision-fenced reconciliation
        run: python -m unittest discover -s tests -p "test_workspace_model.py" -v
      - name: Test registered workspace service operations and bounded sources
        run: python -m unittest discover -s tests -p "test_workspace_service.py" -v
      - name: Test human workspace API with real SQL identities
        run: python -m unittest discover -s tests -p "test_workspace_api.py" -v
      - name: Test category reader strict pagination and inputs
        run: python -m unittest discover -s tests -p "test_workspace_category_reader.py" -v
      - name: Test recorded observation provenance and strict bounds
        run: python -m unittest discover -s tests -p "test_workspace_observed_signals.py" -v
      - name: Test bounded observed signal summaries
        run: python -m unittest discover -s tests -p "test_workspace_signal_summary.py" -v
      - name: Test bounded observed signal quality
        run: python -m unittest discover -s tests -p "test_workspace_signal_quality.py" -v
      - name: Test bounded recorded observation comparison
        run: python -m unittest discover -s tests -p "test_workspace_observation_comparison.py" -v
      - name: Test workspace category signal coverage
        run: python -m unittest discover -s tests -p "test_workspace_category_signal_coverage.py" -v
      - name: Test private workspace HTTP audit and redaction
        run: python -m unittest discover -s tests -p "test_workspace_audit.py" -v
      - name: Test strict read-only workspace journal review
        run: python -m unittest discover -s tests -p "test_workspace_audit_review.py" -v
      - name: Test recovery metadata and cross-database lease rejection
        run: python -m unittest discover -s tests -p "test_workspace_recovery.py" -v
      - name: Test reviewed schema9 legacy backfill and historical HTTP reports
        run: python -m unittest discover -s tests -p "test_workspace_legacy.py" -v
      - name: Test read-only legacy readiness with real PostgreSQL and HTTP
        run: python -m unittest discover -s tests -p "test_workspace_legacy_readiness.py" -v
      - name: Test cancelable offline legacy runtime checkpoint fence
        run: python -m unittest discover -s tests -p "test_workspace_legacy_jobs.py" -v
      - name: Test non-executing approved-scope scanner intent fencing
        run: python -m unittest discover -s tests -p "test_workspace_live_intent.py" -v
      - name: Test expiring single-use non-executable review receipts
        run: python -m unittest discover -s tests -p "test_workspace_intent_receipts.py" -v
      - name: Test authenticated opt-in audited preview over HTTP
        run: python -m unittest discover -s tests -p "test_workspace_live_intent_http.py" -v
      - name: Test durable ledger transitions, concurrent decisions and idempotency
        run: python -m unittest discover -s tests -p "test_workspace_intent_ledger.py" -v
      - name: Test destructive workspace harness guard
        run: python -m unittest discover -s tests -p "test_workspace_backup_guard.py" -v
      - name: Qualify isolated schema8 database and store restore
        env:
          CANCA_WORKSPACE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python tests/workspace_backup_restore_smoke.py --container-id "$CANCA_WORKSPACE_CONTAINER_ID"
      - name: Qualify reviewed schema9 database and original store restore
        env:
          CANCA_WORKSPACE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python tests/workspace_backup_restore_smoke.py --container-id "$CANCA_WORKSPACE_CONTAINER_ID" --reviewed-legacy
      - name: Qualify schema10 review ledger restore without reauthorization
        env:
          CANCA_WORKSPACE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python tests/workspace_backup_restore_smoke.py --container-id "$CANCA_WORKSPACE_CONTAINER_ID" --intent-ledger
