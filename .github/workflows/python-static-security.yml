name: Python Static Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-static-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PR base for incremental security gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$BASE_SHA"
      - name: Install Bandit
        run: python -m pip install 'bandit>=1.8,<2'
      - name: Analyze source and save JSON results (advisory)
        shell: bash
        run: |
          set +e
          bandit -r agent analyzer assessment asset_resolver collectors connected credential_manager credentialed_enrichment evidence_bundle ingestion network_discovery orchestrator persistence runtime server -f json -o bandit-results.json
          code=$?
          echo "Bandit exit code: $code"
          if [ "$code" -gt 1 ]; then
            echo "::warning::Bandit execution error; inspect the artifact and logs."
          elif [ "$code" -eq 1 ]; then
            echo "::warning::Bandit detected potential security issues; review report."
          fi
          exit 0
      - name: Block new HIGH findings on changed Python lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/bandit_changed_lines_gate.py --report bandit-results.json --base "$BASE_SHA"
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-python-security
          path: bandit-results.json
          if-no-files-found: warn
          retention-days: 7
