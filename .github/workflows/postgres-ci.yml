name: PostgreSQL CI

on:
  push:
    branches: [ main, "feature/**", "fix/**", "chore/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  metadata-transactions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: canca_ci
          POSTGRES_USER: canca_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canca_ci -d canca_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: canca_ci
      PGUSER: canca_ci
      PGPASSWORD: synthetic-ci-only
      CANCA_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate composite E0 lab gate fails closed
        run: |
          bash -n docs/validation/R03_E0_LAB_GATE.sh
          if bash docs/validation/R03_E0_LAB_GATE.sh; then
            echo "R03 lab gate accepted missing bundle and manifest" >&2
            exit 1
          fi
          if CANCA_E0_DISPOSABLE_DB=NO bash docs/validation/R03_E0_LAB_GATE.sh /missing/bundle /missing/manifest; then
            echo "R03 lab gate accepted unsafe database confirmation" >&2
            exit 1
          fi
      - name: Validate R03 E0 bundle manifest integrity
        run: python -m unittest discover -s tests -p "test_r03_e0_bundle_manifest.py" -v
      - name: Validate R03 E0 preflight safety guard
        run: |
          bash -n docs/validation/R03_E0_PREFLIGHT.sh
          if CANCA_E0_DISPOSABLE_DB=NO bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight ran without disposable database confirmation" >&2
            exit 1
          fi
          if env -u PGHOST -u PGDATABASE -u PGUSER CANCA_E0_DISPOSABLE_DB=YES bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight ran without mandatory PostgreSQL connection settings" >&2
            exit 1
          fi
          if env CANCA_E0_DISPOSABLE_DB=YES CANCA_E0_EXPECTED_DB=wrong_db bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight accepted mismatched expected database" >&2
            exit 1
          fi
          if env CANCA_E0_DISPOSABLE_DB=YES CANCA_E0_EXPECTED_DB=postgres PGDATABASE=postgres bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight accepted maintenance database" >&2
            exit 1
          fi
          if env PGHOST=example.invalid CANCA_E0_DISPOSABLE_DB=YES CANCA_E0_EXPECTED_DB="$PGDATABASE" bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight accepted non-loopback PGHOST" >&2
            exit 1
          fi
          if env PGPORT=15432 CANCA_E0_DISPOSABLE_DB=YES CANCA_E0_EXPECTED_DB="$PGDATABASE" bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight accepted unexpected PostgreSQL port" >&2
            exit 1
          fi
          for override in PGHOSTADDR PGOPTIONS PGSERVICEFILE; do
            if env "$override=untrusted" CANCA_E0_DISPOSABLE_DB=YES CANCA_E0_EXPECTED_DB="$PGDATABASE" bash docs/validation/R03_E0_PREFLIGHT.sh; then
              echo "R03 preflight accepted unexpected $override" >&2
              exit 1
            fi
          done
          if env PGSERVICE=untrusted CANCA_E0_DISPOSABLE_DB=YES CANCA_E0_EXPECTED_DB="$PGDATABASE" bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight accepted unsupported PGSERVICE configuration" >&2
            exit 1
          fi
      - name: Install optional PostgreSQL driver
        run: python -m pip install -r persistence/requirements-postgres.txt
      - name: Compile persistence
        run: python -m py_compile persistence/P01_PostgreSQL.py persistence/P01_Ingestion_Index.py persistence/P01_Assessment_Lifecycle.py persistence/P01_Asset_Registry.py persistence/P01_Findings.py persistence/P01_Assessment_Report.py persistence/P01_Report_Export.py tests/test_postgres_export.py ingestion/P01_Ingestion_API.py tests/test_postgresql.py tests/test_postgres_ingestion.py tests/test_postgres_lifecycle.py tests/test_postgres_assets.py tests/test_postgres_findings.py tests/test_postgres_report.py tests/test_postgres_lab_fixture.py docs/validation/POSTGRESQL_LAB_FIXTURE_R1_v0.6.5.py docs/validation/POSTGRESQL_LAB_RECOVERY_R1_v0.6.7.py tests/test_postgres_recovery.py docs/validation/POSTGRESQL_LAB_LIFECYCLE_R1_v0.6.8.py tests/test_postgres_lab_lifecycle.py
      - name: Compile executive report
        run: python -m py_compile persistence/P01_Executive_Report.py tests/test_postgres_executive.py
      - name: Compile operator executive download
        run: python -m py_compile server/P01_Operator_Export.py server/P01_Operator_Web.py docs/validation/VERIFY_OPERATOR_WEB_EXECUTIVE_v0.6.15.py tests/test_operator_web_executive.py tests/test_postgres_operator_executive.py
      - name: Compile operator assessment directory
        run: python -m py_compile server/P01_Operator_Auth.py server/P01_Operator_Web.py tests/test_operator_assessments.py tests/test_postgres_operator_assessments.py
      - name: Compile operator executive preview
        run: python -m py_compile server/P01_Operator_Preview.py tests/test_operator_web_preview.py tests/test_postgres_operator_preview.py tests/operator_web_browser_fixture.py
      - name: Compile optional operator server audit
        run: python -m py_compile server/P01_Operator_Audit.py server/P01_Operator_API.py server/P01_Operator_Web.py tests/test_postgres_operator_audit.py
      - name: Compile offline operator audit review
        run: python -m py_compile server/P01_Operator_Audit_Check.py tests/test_postgres_operator_audit.py
      - name: Validate metadata transactions on real PostgreSQL
        run: python -m unittest discover -s tests -p "test_postgres*.py" -v
      - name: Provision disposable R03 E0 database identity
        env:
          CANCA_E0_LAB_ID: github-actions-r03-disposable
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.canca_e0_lab_identity (name text PRIMARY KEY, value text NOT NULL)"
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.canca_e0_lab_identity (name,value) VALUES ('disposable_lab_id','github-actions-r03-disposable') ON CONFLICT (name) DO UPDATE SET value=EXCLUDED.value"
      - name: Verify R03 E0 rejects incorrect or missing database sentinel
        env:
          CANCA_E0_DISPOSABLE_DB: "YES"
          CANCA_E0_EXPECTED_DB: canca_ci
          CANCA_E0_LAB_ID: deliberately-wrong-identity
        run: |
          # A rejected preflight must neither alter the canca schema nor its
          # existing table inventory, even if the schema already exists.
          before="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT coalesce(string_agg(nspname, ',' ORDER BY nspname), '') FROM pg_namespace WHERE nspname='canca'")"
          before_tables="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT coalesce(string_agg(tablename, ',' ORDER BY tablename), '') FROM pg_tables WHERE schemaname='canca'")"
          before_identity="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT value FROM public.canca_e0_lab_identity WHERE name='disposable_lab_id'")"
          if bash docs/validation/R03_E0_PREFLIGHT.sh > /tmp/r03-sentinel-check.log 2>&1; then
            echo "R03 preflight accepted incorrect database sentinel" >&2
            exit 1
          fi
          grep -q "BLOCKED: disposable lab identity does not match" /tmp/r03-sentinel-check.log
          if env -u CANCA_E0_LAB_ID bash docs/validation/R03_E0_PREFLIGHT.sh > /tmp/r03-sentinel-check.log 2>&1; then
            echo "R03 preflight accepted missing sentinel confirmation" >&2
            exit 1
          fi
          grep -q "BLOCKED: disposable lab identity does not match" /tmp/r03-sentinel-check.log
          after="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT coalesce(string_agg(nspname, ',' ORDER BY nspname), '') FROM pg_namespace WHERE nspname='canca'")"
          test "$before" = "$after" || { echo "R03 rejected sentinel changed the canca schema" >&2; exit 1; }
          after_tables="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT coalesce(string_agg(tablename, ',' ORDER BY tablename), '') FROM pg_tables WHERE schemaname='canca'")"
          test "$before_tables" = "$after_tables" || { echo "R03 rejected sentinel changed canca table inventory" >&2; exit 1; }
          after_identity="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT value FROM public.canca_e0_lab_identity WHERE name='disposable_lab_id'")"
          test "$before_identity" = "$after_identity" || { echo "R03 rejected sentinel modified lab identity" >&2; exit 1; }
      - name: Ensure tampered E0 bundle cannot start destructive preflight
        env:
          CANCA_E0_DISPOSABLE_DB: "YES"
          CANCA_E0_EXPECTED_DB: canca_ci
          CANCA_E0_LAB_ID: github-actions-r03-disposable
        run: |
          mkdir -p /tmp/canca-r03-tampered-bundle
          printf '%s\n' '{"interfaces":[]}' > /tmp/canca-r03-tampered-bundle/evidence.json
          python docs/validation/R03_E0_BUNDLE_MANIFEST.py --bundle /tmp/canca-r03-tampered-bundle --output /tmp/canca-r03-tampered-manifest.json
          printf '%s\n' '{"interfaces":[{"changed":true}]}' > /tmp/canca-r03-tampered-bundle/evidence.json
          before="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='canca'")"
          if bash docs/validation/R03_E0_LAB_GATE.sh /tmp/canca-r03-tampered-bundle /tmp/canca-r03-tampered-manifest.json > /tmp/canca-r03-tampered-check.log 2>&1; then
            echo "Tampered bundle was accepted by composite E0 gate" >&2
            exit 1
          fi
          grep -q "FAIL: evidence bundle verification" /tmp/canca-r03-tampered-check.log
          after="$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='canca'")"
          test "$before" = "$after" || { echo "Tampered bundle changed schema existence" >&2; exit 1; }
      - name: Qualify full R03 E0 bundle and guarded SQL gate
        env:
          CANCA_E0_DISPOSABLE_DB: "YES"
          CANCA_E0_EXPECTED_DB: canca_ci
          CANCA_E0_LAB_ID: github-actions-r03-disposable
        run: |
          mkdir -p /tmp/canca-r03-ci-bundle
          printf '%s\n' '{"interfaces":[]}' > /tmp/canca-r03-ci-bundle/ci-synthetic-evidence.json
          python docs/validation/R03_E0_BUNDLE_MANIFEST.py --bundle /tmp/canca-r03-ci-bundle --output /tmp/canca-r03-ci-manifest.json
          CANCA_E0_RESULT_PATH=/tmp/canca-r03-ci-lab-gate-result.json bash docs/validation/R03_E0_LAB_GATE.sh /tmp/canca-r03-ci-bundle /tmp/canca-r03-ci-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/canca-r03-ci-lab-gate-result.json").read_text())
          assert result["preflight"] == "passed"
          assert result["bundle_integrity_before_and_after"] == "passed"
          for key in ("real_collection_import", "operational_recovery", "operational_backup_restore", "operational_e0"):
              assert result[key] == "pending", key
          PY
      - name: Qualify database and evidence store backup restore
        run: python tests/postgres_backup_restore_smoke.py --postgres-container "${{ job.services.postgres.id }}"
      - name: Record R03 automated preflight evidence
        env:
          MATRIX_POSTGRES: ${{ matrix.postgres }}
        run: |
          mkdir -p r03-ci-evidence
          cp /tmp/canca-r03-ci-lab-gate-result.json r03-ci-evidence/lab-gate-result.json
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          evidence = {
              "type": "canca.r03.automated_preflight.v1",
              "status": "passed",
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "postgres_major": os.environ["MATRIX_POSTGRES"],
              "recorded_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "scope": "disposable_ci_database_only",
              "operational_e0": "pending",
              "bundle_origin": "synthetic_ci_fixture",
              "bundle_verified_before_preflight": True,
              "backup_restore_smoke": "passed",
          }
          Path("r03-ci-evidence/result.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload R03 automated preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: r03-preflight-postgres-${{ matrix.postgres }}
          path: r03-ci-evidence/*.json
          if-no-files-found: error
          retention-days: 14
