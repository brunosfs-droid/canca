name: PostgreSQL CI

on:
  push:
    branches: [ main, "feature/**", "fix/**", "chore/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  metadata-transactions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: canca_ci
          POSTGRES_USER: canca_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canca_ci -d canca_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: canca_ci
      PGUSER: canca_ci
      PGPASSWORD: synthetic-ci-only
      CANCA_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate R03 E0 preflight safety guard
        run: |
          bash -n docs/validation/R03_E0_PREFLIGHT.sh
          if CANCA_E0_DISPOSABLE_DB=NO bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight ran without disposable database confirmation" >&2
            exit 1
          fi
          if env -u PGHOST -u PGDATABASE -u PGUSER CANCA_E0_DISPOSABLE_DB=YES bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight ran without mandatory PostgreSQL connection settings" >&2
            exit 1
          fi
          if env PGSERVICE=untrusted CANCA_E0_DISPOSABLE_DB=YES bash docs/validation/R03_E0_PREFLIGHT.sh; then
            echo "R03 preflight accepted unsupported PGSERVICE configuration" >&2
            exit 1
          fi
      - name: Install optional PostgreSQL driver
        run: python -m pip install -r persistence/requirements-postgres.txt
      - name: Compile persistence
        run: python -m py_compile persistence/P01_PostgreSQL.py persistence/P01_Ingestion_Index.py persistence/P01_Assessment_Lifecycle.py persistence/P01_Asset_Registry.py persistence/P01_Findings.py persistence/P01_Assessment_Report.py persistence/P01_Report_Export.py tests/test_postgres_export.py ingestion/P01_Ingestion_API.py tests/test_postgresql.py tests/test_postgres_ingestion.py tests/test_postgres_lifecycle.py tests/test_postgres_assets.py tests/test_postgres_findings.py tests/test_postgres_report.py tests/test_postgres_lab_fixture.py docs/validation/POSTGRESQL_LAB_FIXTURE_R1_v0.6.5.py docs/validation/POSTGRESQL_LAB_RECOVERY_R1_v0.6.7.py tests/test_postgres_recovery.py docs/validation/POSTGRESQL_LAB_LIFECYCLE_R1_v0.6.8.py tests/test_postgres_lab_lifecycle.py
      - name: Compile executive report
        run: python -m py_compile persistence/P01_Executive_Report.py tests/test_postgres_executive.py
      - name: Compile operator executive download
        run: python -m py_compile server/P01_Operator_Export.py server/P01_Operator_Web.py docs/validation/VERIFY_OPERATOR_WEB_EXECUTIVE_v0.6.15.py tests/test_operator_web_executive.py tests/test_postgres_operator_executive.py
      - name: Compile operator assessment directory
        run: python -m py_compile server/P01_Operator_Auth.py server/P01_Operator_Web.py tests/test_operator_assessments.py tests/test_postgres_operator_assessments.py
      - name: Compile operator executive preview
        run: python -m py_compile server/P01_Operator_Preview.py tests/test_operator_web_preview.py tests/test_postgres_operator_preview.py tests/operator_web_browser_fixture.py
      - name: Compile optional operator server audit
        run: python -m py_compile server/P01_Operator_Audit.py server/P01_Operator_API.py server/P01_Operator_Web.py tests/test_postgres_operator_audit.py
      - name: Compile offline operator audit review
        run: python -m py_compile server/P01_Operator_Audit_Check.py tests/test_postgres_operator_audit.py
      - name: Validate metadata transactions on real PostgreSQL
        run: python -m unittest discover -s tests -p "test_postgres*.py" -v
      - name: Qualify interface migration and writer on real PostgreSQL
        env:
          CANCA_TEST_WORKSPACE_POSTGRES: "1"
        run: python -m unittest discover -s tests -p "test_interface*postgres.py" -v
      - name: Qualify database and evidence store backup restore
        run: python tests/postgres_backup_restore_smoke.py --postgres-container "${{ job.services.postgres.id }}"
