name: Projects V2 governance audit
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply only missing classifications (false = audit)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: projects-v2-governance
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project token
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure PROJECTS_TOKEN with project access before running."
            exit 1
          fi
      - name: Audit or fill empty fields
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$APPLY" = "true" ]; then
            python3 scripts/projects_v2_governance.py --apply | tee projects-audit.json
          else
            python3 scripts/projects_v2_governance.py | tee projects-audit.json
          fi
      - name: Generate read-only governance dashboard
        if: success()
        run: python3 scripts/projects_v2_dashboard.py --input projects-audit.json --output projects-dashboard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-v2-governance-audit
          path: |
            projects-audit.json
            projects-dashboard.json
          if-no-files-found: ignore
