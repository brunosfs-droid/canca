version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/credentialed_enrichment"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Python 3.10 remains a supported CI target; pycparser 3.12 requires 3.11+.
    ignore:
      - dependency-name: "pycparser"
        versions: [">=3.12"]
    groups:
      credentialed-enrichment:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/persistence"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
